plugins {
    id 'com.android.application'
}

File keystoreFile = file("${rootDir}/debug.keystore")
File keystoreB64 = file("${rootDir}/debug.keystore.base64")
if (!keystoreFile.exists() && keystoreB64.exists()) {
    try {
        byte[] decoded = java.util.Base64.getDecoder().decode(keystoreB64.text.replaceAll("\\s+", ""))
        keystoreFile.withOutputStream { it.write(decoded) }
    } catch (Exception ignored) {}
}

android {
    namespace 'com.mico.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.mico.jarvis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debugConfig {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}