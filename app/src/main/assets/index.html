<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<style>
:root{--bg:#02060d;--ice:#3fd8ff;--blue:#1e90ff;--dim:#4f7f9c;--txt:#cdeeff;--line:rgba(63,216,255,.3)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 0 8px}
header h1{font-weight:300;font-size:22px;letter-spacing:7px;color:var(--ice);text-align:center}
header small{display:block;text-align:center;font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:2px}
.box{background:none;border:1px solid var(--line);color:var(--ice);font-size:11px;letter-spacing:1px;padding:8px 12px;text-align:left;line-height:1.35;cursor:pointer;justify-self:start}
.box span{display:block;color:var(--dim);font-size:10px}
#online{justify-self:end;font-size:11px;color:var(--dim)}
.btn{background:none;border:1px solid var(--line);color:var(--ice);border-radius:50%;width:46px;height:46px;font-size:19px;display:grid;place-items:center;cursor:pointer;flex:none}
.btn.on{background:rgba(30,144,255,.35);box-shadow:0 0 14px var(--blue)}
main{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 320px;gap:12px}
.panel{position:relative;border:1px solid rgba(63,216,255,.14);background:rgba(10,24,40,.4);padding:14px;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--ice)}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.panel h3{font-size:10px;font-weight:600;color:var(--ice);letter-spacing:2px}
#clock{font-size:42px;font-weight:300;color:var(--ice);line-height:1}
#date{font-size:11px;color:var(--ice);margin-top:6px;letter-spacing:1px}
#weather{font-size:12px;color:var(--dim);line-height:1.4;margin-top:6px}
#weather b{display:block;font-size:30px;font-weight:300;color:var(--ice)}
.st{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:10px;color:var(--dim);margin-top:9px;letter-spacing:1px}
.st em{font-style:normal;color:var(--txt)}
.st i{grid-column:1/3;height:3px;background:rgba(255,255,255,.08);display:block}
.st u{display:block;height:100%}
#stage{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ring{width:min(44vh,34vw);height:min(44vh,34vw)}
#name{margin-top:2px;font-size:13px;letter-spacing:4px;color:var(--txt)}
#status{font-size:10px;letter-spacing:3px;color:var(--ice);margin-top:2px}
#you{font-size:12px;color:var(--dim);margin-top:6px;min-height:16px;text-align:center}
#reply{margin-top:4px;max-height:13vh;overflow-y:auto;width:100%;max-width:520px;text-align:center;font-size:15px;line-height:1.45;padding:0 6px}
#ctl{display:flex;gap:10px;margin-top:10px}
#ctl button{background:none;border:1px solid var(--line);color:var(--ice);font-size:11px;letter-spacing:2px;padding:8px 16px;cursor:pointer}
#ctl button.on{background:rgba(30,144,255,.35)}
#ctl .red{color:#ff5a5a;border-color:rgba(255,90,90,.5)}
#cam{position:absolute;left:0;top:0;width:110px;height:146px;object-fit:cover;border:1px solid var(--ice);display:none}
#log{flex:1;overflow-y:auto;font-size:13px;line-height:1.5}
.m{margin-bottom:9px;white-space:pre-wrap}
.m.u{color:var(--dim)}.m.u::before{content:"SİZ: ";color:var(--blue)}
.m.a::before{content:"JARVIS: ";color:var(--ice)}
#chip{font-size:12px;color:var(--ice);text-align:center;min-height:16px}
#bar{display:flex;gap:8px;align-items:center;padding:6px 0 14px}
#txt{flex:1;min-width:0;background:rgba(10,24,40,.8);border:1px solid var(--line);border-radius:23px;color:var(--txt);padding:13px 18px;font-size:16px;outline:none}
#txt:focus{border-color:var(--ice)}
#mic.on{background:var(--blue);color:#fff;box-shadow:0 0 18px var(--blue)}
#set{position:fixed;inset:0;background:rgba(2,6,13,.97);display:none;flex-direction:column;justify-content:center;gap:14px;padding:24px;z-index:5;max-width:560px;margin:0 auto}
#set input,#set select{background:#0a1828;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:15px;outline:none}
#set input:focus,#set select:focus{border-color:var(--ice)}
#set button.submit{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;cursor:pointer;margin-top:6px}
#set p{font-size:13px;color:var(--dim);line-height:1.5}
@media(max-width:900px){
  main{display:flex;flex-direction:column;overflow-y:auto}
  .side{flex-direction:row;flex-wrap:wrap;gap:10px 22px;flex:none}
  .side .stwrap{display:none}
  #clock{font-size:30px}
  #stage{flex:none;min-height:46vh}
  #ring{width:min(56vw,30vh)}
  .logp{flex:none;height:26vh}
  header small,#online{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="box" id="gear">SİSTEM AYARLARI<span>Model & Anahtar</span></button>
    <div><h1>J.A.R.V.I.S</h1><small>Just A Rather Very Intelligent System</small></div>
    <div id="online">● ÇEVRİMİÇİ</div>
  </header>
  <main>
    <section class="panel side">
      <div><h3>ZAMAN</h3><div id="clock" style="margin-top:8px">--:--</div><div id="date"></div></div>
      <div><h3>HAVA DURUMU</h3><div id="weather"><b>--°</b><span>Yükleniyor</span></div></div>
      <div class="stwrap"><h3>SİSTEM DURUMU</h3><div id="stat"></div></div>
    </section>
    <section id="stage">
      <video id="cam" playsinline muted></video>
      <canvas id="ring" width="600" height="600"></canvas>
      <div id="name">JARVIS</div>
      <div id="status">HAZIR</div>
      <div id="you"></div>
      <div id="reply">Emrinizdeyim, efendim.</div>
      <div id="ctl"><button id="liveBtn">CANLI</button><button id="pauseBtn">DURDUR</button><button id="clearBtn" class="red">TEMİZLE</button></div>
    </section>
    <section class="panel logp">
      <h3>KONUŞMA</h3>
      <div id="log"></div>
    </section>
  </main>
  <div id="chip"></div>
  <div id="bar">
    <button class="btn" id="attach" aria-label="Dosya ekle">📎</button>
    <button class="btn" id="camBtn" aria-label="Kamera">📷</button>
    <input id="txt" placeholder="Mesaj yazın…" autocomplete="off">
    <button class="btn" id="sendBtn" aria-label="Gönder">➤</button>
    <button class="btn" id="mic" aria-label="Konuş">🎙</button>
  </div>
</div>
<input type="file" id="file" accept="image/*,.pdf,.txt,.md,.csv,.json" hidden>

<!-- Settings Modal with Model Dropdown & Fetch -->
<div id="set">
  <h2 style="color:var(--ice);font-weight:300;letter-spacing:2px">SİSTEM AYARLARI</h2>
  <p>Groq veya Gemini API anahtarınızı girin. Modelleri otomatik çekebilir veya önerilen modeli seçebilirsiniz.</p>
  <input id="key" type="password" placeholder="API Anahtarı (gsk_... veya AIza...)" autocomplete="off">
  
  <div style="display:flex;flex-direction:column;gap:6px">
    <label style="color:var(--ice);font-size:11px;letter-spacing:1px">YAPAY ZEKA MODELİ</label>
    <div style="display:flex;gap:8px">
      <select id="modelSelect" style="flex:1;min-width:0"></select>
      <button id="refreshModels" type="button" style="background:rgba(30,144,255,.3);border:1px solid var(--line);color:var(--ice);border-radius:10px;padding:10px 14px;font-size:12px;cursor:pointer;white-space:nowrap;letter-spacing:1px">Modelleri Çek</button>
    </div>
    <div id="modelMsg" style="font-size:11px;color:var(--dim);letter-spacing:1px;min-height:16px"></div>
  </div>

  <input id="city" placeholder="Şehir (hava durumu için, örn: Istanbul)">
  <button id="save" class="submit">Kaydet ve Başlat</button>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// Preload keys from AndroidBridge if available
if (window.AndroidBridge) {
  try {
    const k = window.AndroidBridge.getApiKey();
    if (k && !store.get("key")) store.set("key", k);
  } catch(e){}
}

const DEFAULT_MODELS = [
  { id: "openai/gpt-oss-120b", name: "openai/gpt-oss-120b (Önerilen ⭐)" },
  { id: "llama-3.3-70b-versatile", name: "llama-3.3-70b-versatile" },
  { id: "llama-3.1-8b-instant", name: "llama-3.1-8b-instant" },
  { id: "openai/gpt-oss-20b", name: "openai/gpt-oss-20b" },
  { id: "meta-llama/llama-4-scout-17b-16e-instruct", name: "llama-4-scout-17b-instruct" },
  { id: "qwen/qwen3-32b", name: "qwen/qwen3-32b" },
  { id: "gemini-3.8-flash", name: "gemini-3.8-flash" },
  { id: "gemini-2.5-flash", name: "gemini-2.5-flash" }
];

let MODEL = store.get("model") || "openai/gpt-oss-120b";

function renderModelOptions(list, selectedId) {
  const sel = $("modelSelect");
  sel.innerHTML = "";
  let matched = false;
  list.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.name || m.id;
    opt.style.background = "#0a1828";
    opt.style.color = "#cdeeff";
    if (m.id === selectedId) {
      opt.selected = true;
      matched = true;
    }
    sel.appendChild(opt);
  });
  if (!matched && selectedId) {
    const opt = document.createElement("option");
    opt.value = selectedId;
    opt.textContent = selectedId;
    opt.selected = true;
    opt.style.background = "#0a1828";
    opt.style.color = "#cdeeff";
    sel.insertBefore(opt, sel.firstChild);
  }
}

async function fetchModels() {
  const key = $("key").value.trim() || store.get("key");
  const msg = $("modelMsg");
  if (!key) {
    msg.textContent = "Önce API anahtarınızı girin.";
    msg.style.color = "#ff5a5a";
    return;
  }
  msg.textContent = "Modeller sorgulanıyor…";
  msg.style.color = "var(--ice)";
  try {
    if (key.startsWith("gsk_") || !key.startsWith("AIza")) {
      // Groq Models endpoint
      const res = await fetch("https://api.groq.com/openai/v1/models", {
        headers: { "Authorization": "Bearer " + key }
      });
      if (!res.ok) throw new Error("Hata " + res.status);
      const data = await res.json();
      const ids = (data.data || [])
        .map(x => x.id)
        .filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("tts") && !id.includes("orpheus") && !id.includes("embed"));
      ids.sort();
      
      const list = [];
      const rec = "openai/gpt-oss-120b";
      if (ids.includes(rec)) {
        list.push({ id: rec, name: rec + " (Önerilen ⭐)" });
      }
      ids.forEach(id => {
        if (id !== rec) list.push({ id, name: id });
      });
      if (list.length === 0) throw new Error("Model bulunamadı.");
      renderModelOptions(list, MODEL || rec);
      msg.textContent = list.length + " model yüklendi!";
      msg.style.color = "#35e08a";
    } else {
      // Gemini Models endpoint
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + key);
      if (!res.ok) throw new Error("Hata " + res.status);
      const data = await res.json();
      const list = (data.models || [])
        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => {
          const id = m.name.replace(/^models\//, "");
          return { id, name: id };
        });
      if (list.length === 0) throw new Error("Model bulunamadı.");
      renderModelOptions(list, MODEL || list[0].id);
      msg.textContent = list.length + " model yüklendi!";
      msg.style.color = "#35e08a";
    }
  } catch(e) {
    msg.textContent = "Model listesi alınamadı: " + e.message;
    msg.style.color = "#ff5a5a";
  }
}

$("refreshModels").onclick = fetchModels;

let state="idle",history=[],pending=null,camStream=null,busy=false,speakQ=0,rec=null,listening=false;
const SYSTEM="Sen Tony Stark'ın yapay zekası J.A.R.V.I.S.'sin. Kullanıcıya 'efendim' diye hitap et. Türkçe, akıcı, doğal ve kısa konuş; sesli okunacağı için madde işareti, emoji ve markdown kullanma. Hafif ince espri ve nezaket serbest. Gönderilen fotoğraf, kamera karesi ve dosyaları dikkate alarak cevap ver.";

/* ---------- Ring (Animated Sphere) ---------- */
const P=Array.from({length:70},()=>({a:Math.random()*6.28,r:30+Math.random()*190,s:(Math.random()-.5)*.01,z:1+Math.random()*2}));
const cv=$("ring"),cx=cv.getContext("2d");let ang=0,pulse=0;
function draw(t){
  const speed={idle:.004,listening:.012,thinking:.05,speaking:.02}[state]||.004;
  ang+=speed;
  const lvl=state==="speaking"?(.5+.5*Math.sin(t/90)*Math.sin(t/230)):state==="listening"?(.5+.5*Math.sin(t/300)):0;
  pulse+=(lvl-pulse)*.15;
  const W=600,c=W/2;cx.clearRect(0,0,W,W);
  cx.shadowColor="#3fd8ff";cx.shadowBlur=6;cx.fillStyle="#3fd8ff";cx.globalAlpha=.75;
  P.forEach(p=>{p.a+=p.s*(1+speed*40);const rr=p.r*(1+pulse*.08);cx.beginPath();cx.arc(c+Math.cos(p.a)*rr,c+Math.sin(p.a)*rr,p.z,0,6.28);cx.fill();});
  cx.globalAlpha=1;
  const glow=18+pulse*40+(state==="thinking"?14:0);
  cx.shadowColor="#1e90ff";cx.shadowBlur=glow;
  const rings=[[230,6,[2,0],.6],[195,10,[40,14],-1],[160,5,[4,10],1.6],[120,14,[70,20],-2.2]];
  rings.forEach(([r,w,d,m],i)=>{
    cx.save();cx.translate(c,c);cx.rotate(ang*m);
    cx.setLineDash(d[0]>2?d:[]);cx.lineWidth=w*(1+pulse*.35);
    cx.strokeStyle=i%2?"#1e90ff":"#3fd8ff";cx.globalAlpha=.55+pulse*.45;
    cx.beginPath();cx.arc(0,0,r*(1+pulse*.04*(i+1)/4),0,Math.PI*2);cx.stroke();cx.restore();
  });
  const g=cx.createRadialGradient(c,c,0,c,c,90+pulse*30);
  g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(.35,"rgba(127,219,255,.8)");g.addColorStop(1,"rgba(30,144,255,0)");
  cx.shadowBlur=0;cx.fillStyle=g;cx.beginPath();cx.arc(c,c,90+pulse*30,0,Math.PI*2);cx.fill();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function setState(s){state=s;$("status").textContent={idle:"HAZIR",listening:"DİNLİYORUM",thinking:"DÜŞÜNÜYORUM",speaking:"KONUŞUYORUM"}[s]||"HAZIR";}

function addMsg(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9;return d;}
function tick(){const d=new Date();$("clock").textContent=d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});$("date").textContent=d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
setInterval(tick,1000);tick();
const t0=Date.now();
function bar(l,v,t,c){return `<div class="st"><span>${l}</span><em>${t}</em><i><u style="width:${Math.min(100,v)}%;background:${c}"></u></i></div>`}
async function stats(){let h="";const up=Math.floor((Date.now()-t0)/60000);
h+=bar("ÇALIŞMA SÜRESİ",up,up+" dk","#3fd8ff");
try{
  if (navigator.getBattery) {
    const b=await navigator.getBattery();const l=Math.round(b.level*100);h+=bar("PİL",l,l+"%"+(b.charging?" ⚡":""),"#35e08a");
  } else if (window.AndroidBridge && window.AndroidBridge.getBatteryLevel) {
    const l = window.AndroidBridge.getBatteryLevel();
    if (l >= 0) h+=bar("PİL",l,l+"%","#35e08a");
  }
}catch(e){}
if(navigator.deviceMemory)h+=bar("BELLEK",navigator.deviceMemory/8*100,navigator.deviceMemory+" GB","#ff9f43");
const n=navigator.connection;if(n&&n.downlink)h+=bar("AĞ HIZI",n.downlink/50*100,n.downlink+" Mb/s","#1e90ff");
h+=bar("BAĞLANTI",navigator.onLine?100:0,navigator.onLine?"Çevrimiçi":"Çevrimdışı",navigator.onLine?"#35e08a":"#ff5a5a");
$("stat").innerHTML=h;$("online").textContent=navigator.onLine?"● ÇEVRİMİÇİ":"● ÇEVRİMDIŞI";}
stats();setInterval(stats,15000);

/* ---------- Weather ---------- */
async function weather(){
  try{
    let lat,lon,name=store.get("city");
    if(name){
      const g=await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=tr&name="+encodeURIComponent(name))).json();
      if(g.results&&g.results.length>0){lat=g.results[0].latitude;lon=g.results[0].longitude;name=g.results[0].name;}
    }
    if(lat==null){
      try {
        const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
        lat=p.coords.latitude;lon=p.coords.longitude;name="Konumunuz";
      } catch(e) {
        lat=41.0082;lon=28.9784;name="İstanbul";
      }
    }
    const w=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`)).json();
    const code=w.current.weather_code;
    const desc=code===0?"Açık":code<4?"Parçalı bulutlu":code<50?"Sisli":code<70?"Yağmurlu":code<80?"Karlı":"Fırtınalı";
    $("weather").innerHTML=`<b>${Math.round(w.current.temperature_2m)}°</b><span>${name} · ${desc}</span>`;
  }catch(e){$("weather").innerHTML="<b>--°</b><span>Hava durumu yok</span>";}
}
weather();

/* ---------- Speech out ---------- */
function say(text){
  text=text.trim();if(!text)return;
  if(window.AndroidBridge && window.AndroidBridge.speak){
    speakQ++;setState("speaking");
    window.AndroidBridge.speak(text);
    return;
  }
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);u.lang="tr-TR";u.rate=1.02;u.pitch=.9;
  speakQ++;setState("speaking");
  u.onend=u.onerror=()=>{speakQ--;if(speakQ<=0&&!busy)setState("idle");};
  speechSynthesis.speak(u);
}
function stopSpeak(){
  if(window.AndroidBridge && window.AndroidBridge.stopSpeak) {
    window.AndroidBridge.stopSpeak();
  }
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  speakQ=0;
}
window.onSpoken=function(){
  speakQ--;
  if(speakQ<=0&&!busy)setState("idle");
};

/* ---------- Attachments / camera ---------- */
$("attach").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const b64=()=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(",")[1]);fr.readAsDataURL(f);});
  if(f.type.startsWith("image/"))pending={inlineData:{mimeType:f.type,data:await b64()}};
  else if(f.type==="application/pdf")pending={inlineData:{mimeType:"application/pdf",data:await b64()}};
  else pending={text:`[Dosya: ${f.name}]\n`+(await f.text()).slice(0,60000)};
  $("chip").textContent="📎 "+f.name+" (göndermek için mesaj yazın)";e.target.value="";
};
$("camBtn").onclick=async()=>{
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;$("cam").style.display="none";$("camBtn").classList.remove("on");return;}
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    $("cam").srcObject=camStream;$("cam").style.display="block";$("cam").play();$("camBtn").classList.add("on");
  }catch(e){$("reply").textContent="Kameraya erişemedim. Kamera iznini onaylayın.";}
};
function frame(){
  const v=$("cam");if(!camStream||!v.videoWidth)return null;
  const c=document.createElement("canvas"),s=640/v.videoWidth;c.width=640;c.height=v.videoHeight*s;
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  return {inlineData:{mimeType:"image/jpeg",data:c.toDataURL("image/jpeg",.7).split(",")[1]}};
}

/* ---------- Chat (Gemini / Groq) ---------- */
async function send(text){
  text=text.trim();if(!text||busy)return;
  let key=store.get("key");
  if(window.AndroidBridge && !key) key = window.AndroidBridge.getApiKey();
  if(!key){$("set").style.display="flex";return;}
  stopSpeak();busy=true;setState("thinking");
  $("you").textContent=text;$("reply").textContent="";addMsg("u",text);const am=addMsg("a","");$("txt").value="";$("chip").textContent="";
  
  const curModel = MODEL || "openai/gpt-oss-120b";
  if (key.startsWith("gsk_") || curModel.includes("openai") || curModel.includes("llama") || curModel.includes("qwen")) {
    await sendGroq(text, key, curModel, am);
  } else {
    await sendGemini(text, key, curModel, am);
  }
}

async function sendGroq(text, key, model, am) {
  let userContent = text;
  if(pending && pending.text) userContent = pending.text + "\n\n" + text;
  pending = null;
  const msgs = [
    {role:"system", content:SYSTEM},
    ...history.map(h=>({role:h.role==="model"?"assistant":"user", content:typeof h.parts?.[0]?.text==="string"?h.parts[0].text:text})),
    {role:"user", content:userContent}
  ];
  let full="",buf="";
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model, messages:msgs, stream:true, max_tokens:1000})
    });
    if(!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error?.message || "Hata " + res.status);
    }
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let sb = "";
    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      sb += decoder.decode(value, {stream:true});
      const lines = sb.split("\n"); sb = lines.pop();
      for(const line of lines) {
        if(!line.startsWith("data:")) continue;
        const d = line.slice(5).trim();
        if(d === "[DONE]") break;
        try {
          const j = JSON.parse(d);
          const tx = j.choices?.[0]?.delta?.content || "";
          if(tx) {
            full += tx; buf += tx;
            $("reply").textContent = full; am.textContent = full; $("log").scrollTop = 1e9;
            const m = buf.match(/^([\s\S]*?[.!?\n])\s/);
            if(m) { say(m[1]); buf = buf.slice(m[0].length); }
          }
        }catch(e){}
      }
    }
    if(buf.trim()) say(buf);
    history.push({role:"user",parts:[{text}]},{role:"model",parts:[{text:full}]});
    history = history.slice(-20);
  } catch(e) {
    $("reply").textContent = am.textContent = "Bir sorun var, efendim: " + e.message;
  }
  busy = false; if(speakQ<=0) setState("idle");
}

async function sendGemini(text, key, model, am) {
  const content=[];
  if(pending)content.push(pending);
  const fr=frame();if(fr){content.push(fr);}
  content.push({text});
  pending=null;
  const msgs=[...history,{role:"user",parts:content}];
  let full="",buf="";
  try{
    const body=JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]},contents:msgs,generationConfig:{maxOutputTokens:1000}});
    let r,lastErr="";
    const candidateModels = [model, "gemini-3.8-flash", "gemini-3.5-flash", "gemini-2.5-flash"];
    for(const mdl of [...new Set(candidateModels)]){
      if(!mdl || mdl.startsWith("llama") || mdl.startsWith("openai")) continue;
      r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+mdl+":streamGenerateContent?alt=sse",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body});
      if(r.ok)break;
      const e=await r.json().catch(()=>({}));lastErr=e.error?.message||("Hata "+r.status);
      if(![429,404,500,503].includes(r.status))throw new Error(lastErr);
    }
    if(!r || !r.ok)throw new Error(lastErr);
    const rd=r.body.getReader(),dec=new TextDecoder();let sb="";
    while(true){
      const {done,value}=await rd.read();if(done)break;
      sb+=dec.decode(value,{stream:true});
      const lines=sb.split("\n");sb=lines.pop();
      for(const l of lines){
        if(!l.startsWith("data:"))continue;
        try{const j=JSON.parse(l.slice(5));
          const tx=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("");
          if(tx){
            full+=tx;buf+=tx;$("reply").textContent=full;am.textContent=full;$("log").scrollTop=1e9;
            const m=buf.match(/^([\s\S]*?[.!?\n])\s/);
            if(m){say(m[1]);buf=buf.slice(m[0].length);}
          }}catch(e){}
      }
    }
    if(buf.trim())say(buf);
    history.push({role:"user",parts:[{text:text+(content.length>1?" [ek gönderildi]":"")}]},{role:"model",parts:[{text:full}]});
    history=history.slice(-20);
  }catch(e){
    $("reply").textContent=am.textContent="Bir sorun var, efendim: "+e.message;
  }
  busy=false;if(speakQ<=0)setState("idle");
}

$("sendBtn").onclick=()=>send($("txt").value);
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")send($("txt").value);});

/* ---------- Mic ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let useRec=false,ctxA,proc,srcN,chunks=[],recOn=false,mstream;
function toWav(ch,sr){const n=ch.reduce((a,c)=>a+c.length,0),all=new Float32Array(n);let o=0;ch.forEach(c=>{all.set(c,o);o+=c.length});
  const r=sr/16000,len=Math.floor(n/r),buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  const w=(i,t)=>{for(let k=0;k<t.length;k++)v.setUint8(i+k,t.charCodeAt(k))};
  w(0,"RIFF");v.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){const x=Math.max(-1,Math.min(1,all[Math.floor(i*r)]));v.setInt16(44+i*2,x*32767,true);}
  let b="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b);}

async function toggleRec(){
  if(recOn){recOn=false;proc.disconnect();srcN.disconnect();mstream.getTracks().forEach(t=>t.stop());
    const wav=toWav(chunks,ctxA.sampleRate);ctxA.close();$("mic").classList.remove("on");
    pending={inlineData:{mimeType:"audio/wav",data:wav}};send("(Sesli mesaj) Kaydı dinle ve cevap ver.");return;}
  stopSpeak();
  try{mstream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){$("reply").textContent="Mikrofona erişemedim. Uygulama izinlerini kontrol edin.";return;}
  ctxA=new (window.AudioContext||window.webkitAudioContext)();srcN=ctxA.createMediaStreamSource(mstream);
  proc=ctxA.createScriptProcessor(4096,1,1);chunks=[];
  proc.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  srcN.connect(proc);proc.connect(ctxA.destination);recOn=true;$("mic").classList.add("on");setState("listening");
  $("you").textContent="Kayıt alınıyor… bitirmek için 🎙'a tekrar basın";
}

$("mic").onclick=()=>{
  if(window.AndroidBridge && window.AndroidBridge.toggleMic){
    window.AndroidBridge.toggleMic();
    return;
  }
  if(!SR||useRec){toggleRec();return;}
  if(listening){rec&&rec.stop();return;}
  stopSpeak();rec=new SR();rec.lang="tr-TR";rec.interimResults=true;
  let final="";
  rec.onstart=()=>{listening=true;$("mic").classList.add("on");setState("listening");};
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;final=t;$("you").textContent=t;};
  rec.onend=()=>{listening=false;$("mic").classList.remove("on");if(final)send(final);else setState("idle");};
  rec.onerror=()=>{listening=false;useRec=true;$("mic").classList.remove("on");setState("idle");$("reply").textContent="Ses tanıma çalışmadı, kayıt moduna geçtim. 🎙'a tekrar basın.";};
  rec.start();
};

window.onSpeechResult=function(text,isFinal){
  if(text){
    $("you").textContent=text;
    if(isFinal){send(text);setState("idle");$("mic").classList.remove("on");}
  }
};
window.onSpeechState=function(isListening){
  listening=isListening;
  if(isListening){setState("listening");$("mic").classList.add("on");}
  else{$("mic").classList.remove("on");if(!busy&&speakQ<=0)setState("idle");}
};

$("liveBtn").onclick=()=>{$("camBtn").click();setTimeout(()=>$("liveBtn").classList.toggle("on",!!camStream),400);};
$("pauseBtn").onclick=()=>{stopSpeak();if(!busy)setState("idle");};
$("clearBtn").onclick=()=>{history=[];$("log").innerHTML="";$("reply").textContent="Konuşma temizlendi, efendim.";$("you").textContent="";};

renderModelOptions(DEFAULT_MODELS, MODEL);
let currentKey = store.get("key");
if(window.AndroidBridge && !currentKey) currentKey = window.AndroidBridge.getApiKey();
if(!currentKey)$("set").style.display="flex";
